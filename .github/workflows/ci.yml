name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # N-3: supported LTS lines only. Node 20 reached EOL 2026-04-30 and is
        # deliberately absent (PRDR-055).
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run parity:check
      - run: npm run prompts:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
